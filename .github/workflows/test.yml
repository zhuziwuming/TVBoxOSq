name: Test Build

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Verify Java Version
        run: |
          java -version
          javac -version
      # 彻底移除 setup-android@v3，直接使用 runner 预装的低版本 sdkmanager
      - name: 配置 Android SDK（兼容JDK11无冲突）
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # 自动过滤掉强制要求JDK17的16.0版本sdkmanager
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | grep -v 16.0 | head -n1)
          if [ -z "$SDKM" ]; then SDKM=$(find $ANDROID_HOME -name sdkmanager | grep -v 16.0 | head -n1); fi
          echo "当前使用的sdkmanager路径：$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          SKIP_JDK_VERSION_CHECK: 'true'

      - name: 修复AAPT2系统依赖缺失
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc1 lib32stdc++6 libgcc-s1
          
      - name: Clean Gradle Cache
        run: |
          chmod +x gradlew
          ./gradlew cleanBuildCache --quiet 
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            mv "$file" ${{ github.workspace }}/apk/
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
