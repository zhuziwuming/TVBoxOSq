name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      - name: Verify Java Version
        run: |
          java -version
          javac -version

      # 【新增步骤】修复 Android SDK 中损坏的元数据文件
      # 解决 java.lang.NumberFormatException: Not a number: 34x 问题
      - name: Fix Corrupted SDK Metadata
        run: |
          echo "Searching for corrupted SDK metadata files containing '34x'..."
          # 查找并替换所有 source.properties 和 package.xml 中的非法版本号 "34x" 为 "34"
          find /usr/local/lib/android/sdk -type f $ -name "source.properties" -o -name "package.xml" $ -exec sed -i 's/34x/34/g' {} +
          echo "Verification: Checking if any '34x' remains..."
          if grep -r "34x" /usr/local/lib/android/sdk/; then
            echo "Error: Still found '34x' in SDK files!"
            exit 1
          else
            echo "Success: All SDK metadata files are fixed."
          fi

      - name: Clean Gradle Cache
        run: |
          chmod +x gradlew
          ./gradlew cleanBuildCache --quiet
        
      # 注意：这里重复 checkout 通常是不必要的，除非你有特殊需求
      # 如果不需要重新拉取代码，可以注释掉下面这个 steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          # 更精准的查找方式，避免查找系统其他无关目录
          find . -name "*.apk" -path "*/build/*" -exec cp {} ${{ github.workspace }}/apk/ \; || true

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
