name: Test Build

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Verify Java Version
        run: |
          java -version
          javac -version          
      - name: Clean Gradle Cache & Old Builds
        run: |
          chmod +x gradlew
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          rm -rf app/build/
          ./gradlew clean --quiet
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-build-cache --parallel --no-daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in $(find app/build/outputs/ -name "*.apk" -print); do
            mv "$file" ${{ github.workspace }}/apk/
          done          
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
