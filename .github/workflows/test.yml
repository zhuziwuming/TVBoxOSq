name: Test Build

on:
#  push:
#    branches:
#      - main
#  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Verify Java Version
        run: |
          java -version
          javac -version
      - name: 配置 Android SDK（100%兼容JDK11）
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # 手动下载官方兼容JDK11的cmdline-tools 11.0版本
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -O cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools-11.0
          # 把工具路径加入环境变量
          echo "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools-11.0/cmdline-tools/bin" >> $GITHUB_PATH
          # 执行许可证授权和组件安装
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            env:
            JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64

          
      - name: Clean Gradle Cache
        run: |
          chmod +x gradlew
          ./gradlew cleanBuildCache --quiet 
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            mv "$file" ${{ github.workspace }}/apk/
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
