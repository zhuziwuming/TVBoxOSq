apply plugin: 'com.android.application'
//java {
//   toolchain {
//        languageVersion = JavaLanguageVersion.of(8) // 强制Java 8
//    }
//}

def buildTime() { 
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00")) 
}
configurations.all {
    resolutionStrategy {
        force "com.squareup.okio:okio:2.10.0"
		exclude group: 'com.squareup.okio', module: 'okio-jvm'
		exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'stax', module: 'stax'
        exclude group: 'woodstox', module: 'wstx-asl'
        exclude group: 'dom4j', module: 'dom4j'
        exclude group: 'cglib', module: 'cglib'
        exclude group: 'joda-time', module: 'joda-time'
    }
}

android {
    //compileSdkVersion 30
	compileSdk 34  // 使用最新稳定版
    namespace 'com.github.tvbox.osc' // AGP 7.0+ 要求显式声明 namespace

    defaultConfig {
        applicationId 'com.github.tvbox.osc'
        minSdk 21    // 提升最低支持版本，以兼容现代库
        targetSdk 34 // 必须提升到最新，以避免系统限制
        versionCode 1
        versionName '2.0.'.concat(buildTime())//3.0.20230907_2146.apk
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
		// 2. 修正 NDK 架构，支持 64位
		ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
		exclude '**/classes*.dex'
    }
	
	android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            if (output.outputFileName != null && output.outputFileName.endsWith('.apk')) {
                def fileName
                fileName = "TVBOX-竹子${variant.versionName}.apk"
                output.outputFileName = fileName
            }
        }
    }
	
	signingConfigs {
        config {
            keyAlias 'zhuzige'
            keyPassword '123456'
            storeFile file('zhuzige.jks')
            storePassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
		    // 【关键修改】直接关闭代码压缩和混淆，彻底跳过 R8
            minifyEnabled false
            
            // 建议同时关闭资源压缩，避免潜在的资源引用检查报错
            shrinkResources false
		    signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true

            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    dexOptions {
        javaMaxHeapSize "4g"
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=48000'
        additionalParameters += '--minimal-main-dex'
    }
}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar"])

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation files('libs/thunder.jar')
    implementation files('libs/commons-lang3-3.12.0.jar')

    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:2.8.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'//240724
	//implementation 'com.github.KingJA:LoadSir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'me.jessyan:autosize:1.2.1'//240724
	//implementation 'com.github.jackmoore:autosize:5.0.0'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
        exclude group: 'xpp3',    module: 'xpp3'
        exclude group: 'xpp3',    module: 'xpp3_min'
        exclude group: 'kxml2',   module: 'kxml2'
        exclude group: 'net.sf.kxml', module: 'kxml2'		
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")

    //implementation 'com.lzy.net:okgo:3.0.4'
	//implementation 'com.github.jeasonlzy.okhttp-OkGo:okgo:v3.0.4'
    // implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'
    implementation 'com.owen:tv-recyclerview:3.0.0'//240724
	

    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
}
